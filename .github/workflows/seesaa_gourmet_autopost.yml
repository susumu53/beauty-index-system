name: Seesaa Gourmet AutoPost

on:
  schedule:
    # 日本時間 11:30 (UTC 02:30) ランチ前
    - cron: '30 2 * * *'
    # 日本時間 18:00 (UTC 09:00) 夕食前
    - cron: '0 9 * * *'
  workflow_dispatch: # GitHubのWEB画面から手動実行可能

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Run Gourmet AutoPost
        env:
          SEESAA_EMAIL: ${{ secrets.SEESAA_EMAIL }}
          SEESAA_PASSWORD: ${{ secrets.SEESAA_PASSWORD }}
          DMM_API_ID: ${{ secrets.DMM_API_ID }}
          DMM_AFFILIATE_ID_SEESAA: ${{ secrets.DMM_AFFILIATE_ID_SEESAA }}
          DMM_AFFILIATE_ID: ${{ secrets.DMM_AFFILIATE_ID }}
        run: |
          cd seesaa_autopost
          python post_gourmet_article.py --type auto
